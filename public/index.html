<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bolig Reisetid Søk</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>Bolig Reisetid Søk (prototype)</h1>
    <form id="searchForm">
      <label>FINN søke-URL<br><input type="text" id="finnUrl" placeholder="https://www.finn.no/realestate/homes/search.html? ..." /></label>
      <label>Arbeid A (adresse)<br><input type="text" id="workA" placeholder="Arbeid A adresse" /></label>
      <label>Arbeid B (adresse)<br><input type="text" id="workB" placeholder="Arbeid B adresse" /></label>
      <label>Maks minutter<br><input type="number" id="maxMinutes" value="45" /></label>
      <button type="submit">Søk</button>
    </form>

    <div id="status"></div>
    
    <div id="mapContainer" style="display:none;">
      <h2>Kart</h2>
      <div id="map"></div>
    </div>
    
    <div id="results"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
