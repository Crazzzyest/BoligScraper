name: Daily Property Search

on:
  schedule:
    # Run daily at 06:00 UTC (07:00 CET / 08:00 CEST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  search:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run property search
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          FINN_URL: 'https://www.finn.no/realestate/homes/search.html?filters=&location=0.20003&location=0.20061&min_bedrooms=3&property_type=1&q=landlig&price_to=9500000&price_from=5000000'
          WORK_A: 'Kirkeveien 166, 0450 Oslo, Norway'
          WORK_B: 'Kjeller Vest 8, 2007 Kjeller, Norway'
          MAX_MINUTES: '50'
          PLAYWRIGHT_HEADLESS: 'true'
          MAX_LISTINGS: '100'
        run: node run-search.js

      - name: Upload search results (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-results-${{ github.run_number }}
          path: data.sqlite
          retention-days: 7
